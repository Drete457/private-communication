name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - website/**
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Publish website to gh-pages
        shell: bash
        env:
          WEBSITE_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${WEBSITE_DEPLOY_KEY}" | tr -d '\r' > "$HOME/.ssh/website_deploy_key"
          chmod 600 "$HOME/.ssh/website_deploy_key"
          ssh-keygen -yf "$HOME/.ssh/website_deploy_key" > /dev/null
          ssh-keyscan -H github.com > "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/website_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          git clone --depth 1 "git@github.com:${GITHUB_REPOSITORY}.git" repo
          cd repo

          publish_dir="$(mktemp -d)"
          cp -R website/. "${publish_dir}/"
          : > "${publish_dir}/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git switch -C gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
            git rm -rf . > /dev/null 2>&1 || true
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${publish_dir}/." .

          git add --all

          if git diff --cached --quiet; then
            echo "No website changes to publish."
            exit 0
          fi

          git commit -m "Deploy website from ${GITHUB_SHA}"
          git push origin gh-pages
