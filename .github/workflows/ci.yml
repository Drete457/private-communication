name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          mkdir repo
          cd repo
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Ensure Node.js 24
        shell: bash
        run: |
          set -euo pipefail

          current_major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
          if [ "${current_major}" -lt 24 ]; then
            case "$(uname -m)" in
              x86_64)
                node_arch="x64"
                ;;
              aarch64|arm64)
                node_arch="arm64"
                ;;
              *)
                echo "Unsupported runner architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac

            release_file="$(curl -fsSL https://nodejs.org/dist/latest-v24.x/SHASUMS256.txt | awk "/linux-${node_arch}\\.tar\\.xz$/ { print \\$2; exit }")"
            if [ -z "${release_file}" ]; then
              echo "Could not resolve a Node.js 24 Linux archive for ${node_arch}." >&2
              exit 1
            fi

            release_version="${release_file#node-}"
            release_version="${release_version%-linux-${node_arch}.tar.xz}"
            install_dir="$HOME/.local/node-${release_version}"

            mkdir -p "${install_dir}"
            curl -fsSL "https://nodejs.org/dist/latest-v24.x/${release_file}" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C "${install_dir}" --strip-components=1
            echo "${install_dir}/bin" >> "${GITHUB_PATH}"
            export PATH="${install_dir}/bin:${PATH}"
          fi

          node --version
          npm --version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd repo
          npm ci

      - name: Validate backend
        shell: bash
        run: |
          set -euo pipefail

          cd repo
          npm run lint --workspace backend
          npm run build --workspace backend

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail

          cd repo
          npm run lint --workspace frontend
          npm run build --workspace frontend
          npm run test --workspace frontend

      - name: Validate PCBK core
        shell: bash
        run: |
          set -euo pipefail

          cd repo
          npm run lint --workspace @private-communication/pcbk-core
          npm run typecheck --workspace @private-communication/pcbk-core
          npm run test --workspace @private-communication/pcbk-core