# =====================================================
# Private P2P Communication - Docker Compose
# =====================================================
# 
# This docker-compose.yml orchestrates all services for
# the Private P2P Communication system on Raspberry Pi.
#
# Services:
# - app: Node.js signaling server
# - nginx: Reverse proxy with SSL termination
# - coturn: STUN/TURN server for WebRTC NAT traversal
# - redis: Message queue and user registration store
#
# Prerequisites:
# 1. Configure DDNS (e.g., mychat.duckdns.org)
# 2. Set up port forwarding: 80/443 (TCP), 3478 (UDP/TCP)
# 3. Copy .env.example to .env and configure
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop all services
#
# =====================================================

services:
  # =================================================
  # Node.js Signaling Server
  # =================================================
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: private-comm-app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MESSAGE_QUEUE_TTL=604800
      - LOG_LEVEL=info
    volumes:
      - attachments-data:/data/attachments
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    networks:
      private-comm-network:
        aliases:
          - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =================================================
  # Read-only Docker API Proxy for Dashboard Metadata
  # =================================================
  docker-socket-proxy:
    build:
      context: .
      dockerfile: docker/docker-socket-proxy/Dockerfile
    container_name: private-comm-docker-socket-proxy
    restart: unless-stopped
    environment:
      - PORT=2375
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      private-comm-network:
        aliases:
          - docker-socket-proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:2375/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # =================================================
  # Dashboard Static UI
  # =================================================
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: private-comm-dashboard
    restart: unless-stopped
    networks:
      private-comm-network:
        aliases:
          - dashboard
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # =================================================
  # Nginx Reverse Proxy with SSL
  # =================================================
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: private-comm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
      - dashboard
    networks:
      - private-comm-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =================================================
  # Certbot for SSL Certificate Management
  # =================================================
  certbot:
    image: certbot/certbot:latest
    # Use multi-arch image so it runs on both amd64 and arm64
    container_name: private-comm-certbot
    pid: "service:nginx"
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    # Run renewal check twice daily
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

  # =================================================
  # Coturn STUN/TURN Server
  # =================================================
  coturn:
    image: coturn/coturn:alpine
    container_name: private-comm-coturn
    restart: unless-stopped
    ports:
      # STUN/TURN listening port
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # TURN TLS
      - "5349:5349/tcp"
      # TURN relay ports range
      - "49152-50000:49152-50000/udp"
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./docker/certbot/conf/coturn:/etc/coturn/certs:ro
    networks:
      private-comm-network:
        ipv4_address: 172.30.0.5
    # Note: For production, update turnserver.conf with your DDNS hostname
    command: ["-c", "/etc/coturn/turnserver.conf"]

  # =================================================
  # Redis for Message Queue & User Store
  # =================================================
  redis:
    image: redis:8.6.2-alpine
    container_name: private-comm-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      private-comm-network:
        aliases:
          - redis
    # Persistence configuration
    command: redis-server --appendonly yes --maxmemory 2048mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# =================================================
# Networks
# =================================================
networks:
  private-comm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          ip_range: 172.30.10.0/24

# =================================================
# Volumes
# =================================================
volumes:
  attachments-data:
    driver: local
  redis-data:
    driver: local
