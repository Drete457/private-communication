# =====================================================
# Dev Server Configuration - HTTPS (Port 443)
# =====================================================
# Reverse proxy to Vite dev server and backend

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;

    # Use Docker's internal DNS so upstream names are resolved per-request,
    # not at startup. This prevents nginx from crashing when app-dev or
    # frontend-dev are still initializing (npm install / compile).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Per-IP connection limit (tuned for chat/WebSocket usage)
    limit_conn conn_limit 20;
    limit_conn_status 429;

    # Self-signed certificate for local dev
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # =================================================
    # Frontend (Vite dev server)
    # =================================================
    location = /dashboard {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        return 302 /dashboard/;
    }

    location ^~ /dashboard/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        proxy_pass http://dashboard-dev:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend http://frontend-dev:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (Vite HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =================================================
    # API Proxy (REST endpoints)
    # =================================================
    location ^~ /api/dashboard/ {
        limit_req zone=api_limit burst=10 nodelay;

        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        set $backend http://app-dev:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location /api/ {
        set $backend http://app-dev:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming/SSE
        proxy_buffering off;
    }

    # Health check endpoint
    location = /health/ready {
        set $backend http://app-dev:8080;
        proxy_pass $backend/health/ready;
        proxy_http_version 1.1;
    }

    location /health {
        set $backend http://app-dev:8080;
        proxy_pass $backend/health;
        proxy_http_version 1.1;
    }

    # =================================================
    # WebSocket Proxy (Signaling Server)
    # =================================================
    location /ws {
        set $backend http://app-dev:8080;
        proxy_pass $backend/ws;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
