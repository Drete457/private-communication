# =====================================================
# Server Configuration - HTTPS (Port 443)
# =====================================================
# Main server block with SSL termination
#
# IMPORTANT: Before enabling SSL:
# 1. Obtain certificates: ./scripts/init-ssl.sh
# 2. Replace YOUR_DOMAIN with your DDNS hostname
# 3. Uncomment SSL configuration lines

# Canonical host redirect (prevents cert/host mismatch confusion)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/privkey.pem;

    # Keep health checks available even on non-canonical hosts (LAN / local access)
    location = /health {
        proxy_pass http://app:8080/health;
        proxy_http_version 1.1;
    }

    location = /health/ready {
        proxy_pass http://app:8080/health/ready;
        proxy_http_version 1.1;
    }

    # Keep the dashboard private to the local machine or LAN/VPN clients.
    location = /dashboard {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        return 302 /dashboard/;
    }

    location ^~ /dashboard/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        proxy_pass http://dashboard:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/dashboard/ {
        limit_req zone=api_limit burst=10 nodelay;

        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    return 301 https://YOUR_DOMAIN.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    
    # TODO: Replace with your DDNS hostname
    server_name YOUR_DOMAIN.duckdns.org;

    # Per-IP connection limit (tuned for chat/WebSocket usage)
    limit_conn conn_limit 20;
    limit_conn_status 429;

    # =================================================
    # SSL Configuration (Let's Encrypt)
    # =================================================
    # SSL Configuration (Let's Encrypt - The script will update these)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/privkey.pem;
    
    # SSL security settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling (The script will uncomment and update these)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/chain.pem;
    
    # The script will update this with your LOCAL_IP and 8.8.8.8
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # =================================================
    # PWA Static Files
    # =================================================
    root /usr/share/nginx/html;
    index index.html;

    location = /dashboard {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        return 302 /dashboard/;
    }

    location ^~ /dashboard/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        proxy_pass http://dashboard:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service Worker scope
    location /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # PWA manifest
    location /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =================================================
    # API Proxy (REST endpoints)
    # =================================================
    location ~ ^/api/attachments/[^/]+/chunks/[0-9]+$ {
        limit_req zone=attachments_chunks_limit burst=120;

        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /api/dashboard/ {
        limit_req zone=api_limit burst=10 nodelay;

        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        allow fe80::/10;
        deny all;

        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API timeouts (for long-running requests)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable buffering for streaming/SSE
        proxy_buffering off;
    }

    # Health check endpoint
    location = /health/ready {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://app:8080/health/ready;
        proxy_http_version 1.1;
    }

    location /health {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://app:8080/health;
        proxy_http_version 1.1;
    }

    # =================================================
    # WebSocket Proxy (Signaling Server)
    # =================================================
    location /ws {
        proxy_pass http://app:8080/ws;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Disable buffering for real-time
        proxy_buffering off;
    }

    # =================================================
    # Security - Block sensitive files
    # =================================================
    location ~ /\. {
        deny all;
    }

    location ~ ^/(\.git|\.env|docker|node_modules) {
        deny all;
    }
}
