# =====================================================
# Coturn STUN/TURN Server Configuration
# =====================================================
# Essential for WebRTC NAT traversal
#
# IMPORTANT: Before production use:
# 1. Replace YOUR_DOMAIN with your DDNS hostname
# 2. Replace YOUR_PUBLIC_IP with your external IP
# 3. Generate secure credentials for TURN authentication
# 4. Enable TLS after obtaining SSL certificates
#
# =====================================================

# =================================================
# Network Configuration
# =================================================

# Listening port for STUN/TURN
listening-port=3478

# Listen on all interfaces inside the container
listening-ip=0.0.0.0

# Alternative listening port (TLS)
# tls-listening-port=5349

# External IP address (your public IP)
# Required for NAT traversal to work correctly
# Replace with your actual public IP or use detect-external-ip
# Format: public_ip/private_ip (private_ip is the container IP, e.g. 172.18.0.5)
# external-ip=YOUR_PUBLIC_IP/PRIVATE_IP

# Relay ports range (for TURN relay connections)
min-port=49152
max-port=50000

# Use fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
# lt-cred-mech

# =================================================
# Authentication
# =================================================

# Realm (use your domain)
# realm=YOUR_DOMAIN.duckdns.org
realm=YOUR_DOMAIN.duckdns.org

# Ephemeral TURN credentials (REST API style)
# Coturn validates HMAC usernames using the shared secret below
use-auth-secret
static-auth-secret=YOUR_TURN_SECRET

# Alternatively, use CLI tool to add users:
# docker exec private-comm-coturn turnadmin -a -u username -p password -r private-comm

# =================================================
# Logging
# =================================================

# Log to stdout (for Docker)
log-file=stdout

# Write the pid file to a writable location when Coturn runs unprivileged.
pidfile=/tmp/turnserver.pid

# Verbose logging (useful for debugging)
# verbose

# =================================================
# Security
# =================================================

# Disable TCP relay (UDP is preferred for media)
# no-tcp-relay

# Disable UDP relay (not recommended)
# no-udp-relay

# Disable multicast peers
no-multicast-peers

# Disable loopback peers
no-loopback-peers

# Disable CLI (not needed in container)
no-cli

# =================================================
# TLS Configuration (Enable after obtaining certs)
# =================================================

# Path to the staged TLS certificate and key for Coturn.
# setup.sh and the certbot renewal hook copy readable files into this directory.
# cert=/etc/coturn/certs/YOUR_DOMAIN.duckdns.org/fullchain.pem
# pkey=/etc/coturn/certs/YOUR_DOMAIN.duckdns.org/privkey.pem

# Disable old/insecure TLS versions
# no-tlsv1
# no-tlsv1_1

# =================================================
# Performance (Raspberry Pi optimized)
# =================================================

# Total relay threads
relay-threads=2

# Maximum bandwidth per session (in bytes/sec)
# Useful for limiting on Raspberry Pi
# max-bps=1000000

# No STUN binding response for allocation requests
# (improves performance slightly)
no-stun-backward-compatibility
