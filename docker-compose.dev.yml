services:
  nginx-dev:
    image: nginx:alpine
    container_name: private-comm-nginx-dev
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d-dev:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend-dev
      - app-dev
      - dashboard-dev
    networks:
      - private-comm-network

  dashboard-dev:
    image: nginx:alpine
    container_name: private-comm-dashboard-dev
    restart: unless-stopped
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      private-comm-network:
        aliases:
          - dashboard-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend-dev:
    image: node:alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace frontend -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./:/workspace
      - frontend-node-modules:/workspace/node_modules
      - frontend-package-node-modules:/workspace/frontend/node_modules
      - pcbk-core-node-modules:/workspace/packages/pcbk-core/node_modules
    ports:
      - "3000:3000"
    environment:
      # Point Vite to local signaling server (proxied in vite.config.js too)
      - VITE_SIGNALING_SERVER_URL=ws://localhost:8080/ws
      - VITE_DEV_PROXY_TARGET=http://app-dev:8080
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=300
    depends_on:
      - app-dev
    networks:
      private-comm-network:
        aliases:
          - frontend-dev

  docker-socket-proxy-dev:
    build:
      context: .
      dockerfile: docker/docker-socket-proxy/Dockerfile
    container_name: private-comm-docker-socket-proxy-dev
    restart: unless-stopped
    environment:
      - PORT=2375
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      private-comm-network:
        aliases:
          - docker-socket-proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:2375/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  app-dev:
    image: node:alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - attachments-dev-data:/data/attachments
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MESSAGE_QUEUE_TTL=604800
      - LOG_LEVEL=debug
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy-dev:
        condition: service_healthy
    networks:
      private-comm-network:
        aliases:
          - app-dev

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      private-comm-network:
        aliases:
          - redis
    command: redis-server --appendonly yes --maxmemory 2048mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


networks:
  private-comm-network:
    external: false

volumes:
  frontend-node-modules:
  frontend-package-node-modules:
  pcbk-core-node-modules:
  backend-node-modules:
  attachments-dev-data:
  redis-data:
